[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "meeting-scheduling-agent"
version = "0.1.0"
description = "A LangGraph meeting scheduling agent scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.60",
  "langchain-core>=0.3.0",
  "python-dotenv>=1.0.1",
  "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
llm = [
  "langchain-openai>=0.2.0",
]

[project.scripts]
meeting-scheduler-agent = "meeting_scheduler_agent.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
